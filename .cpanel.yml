---
deployment:
  tasks:
    - export DEPLOYPATH=/home/gyu5la0fbzjq/public_html/nauticahome.com.mx
    - /bin/rm -rf "$DEPLOYPATH/css"
    - /bin/rm -rf "$DEPLOYPATH/js"
    - /bin/rm -rf "$DEPLOYPATH/api"
    - /bin/rm -rf "$DEPLOYPATH/__MACOSX"
    - /bin/rm -f "$DEPLOYPATH"/*.html
    - /bin/rm -f "$DEPLOYPATH/robots.txt"
    - /bin/rm -f "$DEPLOYPATH/sitemap.xml"
    - /bin/mkdir -p "$DEPLOYPATH/assets"
    - if [ -d assets ]; then /bin/cp -R assets/. "$DEPLOYPATH/assets/"; fi
    - if [ -d css ]; then /bin/cp -R css "$DEPLOYPATH/"; fi
    - if [ -d js ]; then /bin/cp -R js "$DEPLOYPATH/"; fi
    - if [ -d api ]; then /bin/cp -R api "$DEPLOYPATH/"; fi
    - if ls *.html >/dev/null 2>&1; then /bin/cp *.html "$DEPLOYPATH/"; fi
    - if [ -f robots.txt ]; then /bin/cp robots.txt "$DEPLOYPATH/"; fi
    - echo '<?xml version="1.0" encoding="UTF-8"?>' > "$DEPLOYPATH/sitemap.xml"
    - echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> "$DEPLOYPATH/sitemap.xml"
    - if [ -f index.html ] && ! /bin/grep -qi "noindex" index.html; then echo '  <url><loc>https://nauticahome.com.mx/</loc></url>' >> "$DEPLOYPATH/sitemap.xml"; fi
    - for file in *.html; do if [ "$file" != "index.html" ] && [ "$file" != "intro.html" ] && ! /bin/grep -qi "noindex" "$file"; then echo "  <url><loc>https://nauticahome.com.mx/$file</loc></url>" >> "$DEPLOYPATH/sitemap.xml"; fi; done
    - echo '</urlset>' >> "$DEPLOYPATH/sitemap.xml"
