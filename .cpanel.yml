---
deployment:
  tasks:
    - export DEPLOYPATH=/home/gyu5la0fbzjq/public_html/nauticahome.com.mx

    # Limpiar carpetas gestionadas por Git, excepto assets
    - /bin/rm -rf "$DEPLOYPATH/css"
    - /bin/rm -rf "$DEPLOYPATH/js"
    - /bin/rm -rf "$DEPLOYPATH/__MACOSX"

    # Limpiar HTML actuales
    - /bin/rm -f "$DEPLOYPATH"/*.html

    # Asegurar que assets exista
    - /bin/mkdir -p "$DEPLOYPATH/assets"

    # Actualizar assets SIN borrar hero-nautica.mp4 existente
    - /bin/cp -R assets/. "$DEPLOYPATH/assets/"

    # Actualizar CSS y JS
    - /bin/cp -R css "$DEPLOYPATH/"
    - /bin/cp -R js "$DEPLOYPATH/"

    # Copiar todos los HTML
    - /bin/cp *.html "$DEPLOYPATH/"
